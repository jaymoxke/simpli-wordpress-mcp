name: V3 Durable OAuth CI

on:
  push:
    branches: [v3-oauth-durable]
  pull_request:
    branches: [v3-protocol-mcp-v2]

permissions:
  contents: write

jobs:
  verify-durable-oauth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Use pinned npm for deterministic lock generation
        run: npm install --global npm@11.6.0
      - name: Generate exact rc.3 dependency lock
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Install from generated lock
        run: npm ci --no-audit --no-fund
      - name: Type and static checks
        run: npm run check
      - name: Tests
        run: npm test
      - name: WhatsApp gateway static checks
        working-directory: whatsapp-gateway
        run: npm run check
      - name: WhatsApp gateway tests
        working-directory: whatsapp-gateway
        run: npm test
      - name: Build
        run: npm run build
      - name: Runtime syntax check
        run: node --check dist/server.js
      - name: Container build
        run: docker build -t simpli-mcp-v3-oauth:test .
      - name: Commit verified dependency lock to OAuth branch
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "v3 oauth: lock verified rc.3 dependencies [skip ci]"
          git push origin HEAD:v3-oauth-durable
      - name: Retain generated lock evidence
        uses: actions/upload-artifact@v4
        with:
          name: v3-oauth-package-lock
          path: package-lock.json
          if-no-files-found: error
