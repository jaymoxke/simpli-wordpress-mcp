name: V3 Protocol Migration CI

on:
  push:
    branches: [v3-protocol-mcp-v2]
  pull_request:
    branches: [v3-foundation-novamira-free]

permissions:
  contents: read

jobs:
  verify-protocol-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use current npm for deterministic lock generation
        run: npm install --global npm@11.6.0
      - name: Generate exact v3 protocol dependency lock
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --no-audit --no-fund
      - name: Install from generated lock
        run: npm ci --no-audit --no-fund
      - name: Type and static checks
        run: npm run check
      - name: Tests
        run: npm test
      - name: WhatsApp gateway static checks
        working-directory: whatsapp-gateway
        run: npm run check
      - name: WhatsApp gateway tests
        working-directory: whatsapp-gateway
        run: npm test
      - name: Build
        run: npm run build
      - name: Runtime syntax check
        run: node --check dist/server.js
      - name: Retain generated lock for branch repair
        uses: actions/upload-artifact@v4
        with:
          name: v3-protocol-package-lock
          path: package-lock.json
          if-no-files-found: error
